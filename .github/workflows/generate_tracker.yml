name: Generate Daily Project Tracker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tracker/requirements.txt

      - name: Generate Excel tracker
        run: python tracker/generate_tracker.py

      - name: Upload tracker as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily_project_tracker
          path: daily_project_tracker.xlsx
          retention-days: 30
